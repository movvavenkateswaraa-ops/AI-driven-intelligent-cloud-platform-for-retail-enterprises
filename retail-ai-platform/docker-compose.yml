services:
  web:
    build: .
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      RETAIL_DB_PATH: /data/retail.db
    volumes:
      - retail_data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 30s
volumes:
  retail_data:
